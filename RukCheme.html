<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ขอบคุณคุณครูเคมี</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            margin: 0;
            overflow: hidden; /* ป้องกันการเลื่อนหน้าจอเมื่อมีเอฟเฟกต์ลอย */
            background-color: #000;
        }

        /* Background Layers */
        .bg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            transition: opacity 2s ease-in-out;
            z-index: 1;
        }

        /* ธีมธรรมชาติ */
        #nature-bg {
            background: linear-gradient(135deg, #a8e063 0%, #56ab2f 100%);
            opacity: 1;
        }

        /* ธีมเคมี */
        #chem-bg {
            background: linear-gradient(135deg, #141e30 0%, #243b55 100%);
            opacity: 0; /* ซ่อนไว้ก่อน */
        }

        #chem-bg::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(rgba(0, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        /* Container หลักให้อยู่เหนือ Background */
        #main-content {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }

        /* ปุ่มกด */
        .magic-btn {
            background: linear-gradient(45deg, #fff, #f0f0f0);
            color: #2e7d32;
            padding: 1rem 2.5rem;
            border-radius: 9999px;
            font-size: 1.5rem;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid #81c784;
            animation: pulse 2s infinite;
        }

        .magic-btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }

        /* ข้อความขอบคุณ */
        #message-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 2.5rem;
            max-width: 90%;
            width: 500px;
            text-align: center;
            color: #fff;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            transform: translateY(50px);
            opacity: 0;
            transition: all 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #message-box.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* เอฟเฟกต์อนุภาคลอย (Particles) */
        .particle {
            position: absolute;
            pointer-events: none;
            z-index: 5;
            animation: floatUp linear forwards;
        }

        /* Animations */
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(255, 255, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg) scale(0.5);
                opacity: 0;
            }
            10% {
                opacity: 1;
                transform: translateY(-10vh) rotate(20deg) scale(1);
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-120vh) rotate(360deg) scale(1.2);
                opacity: 0;
            }
        }

        .glow-text {
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5), 0 0 20px rgba(0, 255, 255, 0.3);
        }
    </style>
</head>
<body>

    <!-- พื้นหลังธรรมชาติ -->
    <div id="nature-bg" class="bg-layer"></div>
    
    <!-- พื้นหลังเคมี -->
    <div id="chem-bg" class="bg-layer"></div>

    <!-- Container สำหรับแสดง Effect ลอยๆ -->
    <div id="particles-container" class="absolute top-0 left-0 w-full h-full pointer-events-none z-10 overflow-hidden"></div>

    <!-- เนื้อหาหลัก -->
    <div id="main-content">
        
        <!-- ปุ่มกดเริ่ม -->
        <button id="start-btn" class="magic-btn flex items-center gap-2">
            🌿 กดดูสิครับ 🌿
        </button>

        <!-- กล่องข้อความ (ซ่อนไว้ตอนแรก) -->
        <div id="message-box" class="hidden flex-col items-center justify-center">
            <div class="text-5xl mb-4">👨‍🔬👩‍🔬</div>
            <h1 class="text-3xl md:text-4xl font-bold mb-4 text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 to-blue-500 glow-text">
                ขอบพระคุณเป็นอย่างสูง
            </h1>
            <p class="text-lg md:text-xl leading-relaxed mb-6 text-gray-100">
                🎉ผมดีใจจริงๆนะครับที่ได้เรียนกับคุณครูไผ่ตอนแรกนึกว่าเคมีม.5จะน่าเบื่อจนหลับคาโต๊ะซะแล้ว🥳 <br>
                🦖ต้องขอบคุณที่เหนื่อยสอนมาตลอดทั้งเทอมนะครับ <br>
                ตอนคุณครูสอนนั้นผมรู้สึกว่าสนุกและเป็นกันเองมากเลยครับ ผมอยากเรียนเทมอ2แล้วววววว❤️
            </p>
            <div class="inline-block bg-white/20 rounded-full px-6 py-2 border border-white/30 text-white font-medium shadow-lg backdrop-blur-md">
                รักคุณครูไผ่มักๆนะครับ ❤️🧪
            </div>
        </div>
    </div>

    <script>
        const startBtn = document.getElementById('start-btn');
        const natureBg = document.getElementById('nature-bg');
        const chemBg = document.getElementById('chem-bg');
        const messageBox = document.getElementById('message-box');
        const particlesContainer = document.getElementById('particles-container');

        // อีโมจิสำหรับสร้างเอฟเฟกต์
        const natureEmojis = ['🍃', '🌿', '🌱', '☀️', '🦋'];
        const heartEmojis = ['❤️', '💖', '✨', '💓', '💗'];
        const chemEmojis = ['🧪', '🔬', '⚛️', '🧬', '🫧', '🌡️'];

        // ฟังก์ชันสุ่มตัวเลข
        function random(min, max) {
            return Math.random() * (max - min) + min;
        }

        // ฟังก์ชันสร้างอนุภาคลอย (Particles)
        function createParticles(emojiArray, count, durationBase) {
            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // สุ่มอีโมจิจาก Array ที่กำหนด
                particle.innerText = emojiArray[Math.floor(Math.random() * emojiArray.length)];
                
                // สุ่มขนาด
                const size = random(1.5, 3);
                particle.style.fontSize = `${size}rem`;
                
                // สุ่มตำแหน่งเริ่มต้น (แกน X)
                particle.style.left = `${random(5, 95)}vw`;
                
                // สุ่มตำแหน่งเริ่มต้น (แกน Y) ให้อยู่ขอบล่างของจอ
                particle.style.top = `100vh`;
                
                // สุ่มระยะเวลาการลอยขึ้น
                const duration = random(durationBase, durationBase + 3);
                particle.style.animationDuration = `${duration}s`;
                
                // สุ่มดีเลย์เพื่อไม่ให้มันลอยขึ้นมาพร้อมกันหมด
                const delay = random(0, 2);
                particle.style.animationDelay = `${delay}s`;

                particlesContainer.appendChild(particle);

                // ลบ Element ทิ้งเมื่อแอนิเมชันจบเพื่อคืนพื้นที่หน่วยความจำ
                setTimeout(() => {
                    particle.remove();
                }, (duration + delay) * 1000);
            }
        }

        // ให้มีใบไม้ลอยเบาๆ ตั้งแต่เริ่มต้น (ธีมธรรมชาติ)
        let natureInterval = setInterval(() => {
            createParticles(natureEmojis, 1, 4);
        }, 1000);

        // เมื่อกดปุ่ม
        startBtn.addEventListener('click', () => {
            // 1. ทำให้ปุ่มหายไป
            startBtn.style.transform = 'scale(0)';
            startBtn.style.opacity = '0';
            setTimeout(() => {
                startBtn.style.display = 'none';
            }, 300);

            // หยุดสร้างใบไม้
            clearInterval(natureInterval);

            // 2. เปลี่ยนพื้นหลังเป็นธีมเคมี
            natureBg.style.opacity = '0';
            chemBg.style.opacity = '1';

            // 3. ระเบิดหัวใจขึ้นมา
            createParticles(heartEmojis, 40, 3);

            // 4. สร้างสัญลักษณ์เคมีลอยขึ้นมา
            setTimeout(() => {
                // สร้างแบบต่อเนื่อง
                setInterval(() => {
                    createParticles(chemEmojis, 2, 5);
                }, 800);
                
                // สร้างฟองสบู่เพิ่ม (ใช้สัญลักษณ์ 🫧)
                setInterval(() => {
                    createParticles(['🫧'], 1, 4);
                }, 400);
            }, 1000);

            // 5. แสดงกล่องข้อความขอบคุณคุณครู
            setTimeout(() => {
                messageBox.classList.remove('hidden');
                messageBox.style.display = 'flex';
                // ใช้ Timeout นิดนึงเพื่อให้ CSS render ก่อนใส่คลาส show
                setTimeout(() => {
                    messageBox.classList.add('show');
                }, 50);
            }, 1500);
        });
    </script>
</body>
</html>
